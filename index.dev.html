<!DOCTYPE html>
<html>
  <head>

    <meta charset="utf-8" />
    <title>SmartRPD Lite Web — OFFLINE MOCK</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* Default styles for the loading bar */
      .loading-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999; /* Ensure the loading bar stays on top */
      }
      .loading-bar {
        width: 200px;
        height: 20px;
        background-color: #e0e0e0; /* Light grey background */
        overflow: hidden; /* Hide anything that overflows */
        position: relative;
        margin: 0 auto;
        /* Center the loading bar vertically */
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      /* Default styles for the loading progress */
      .loading-progress {
        width: 100%; /* Width of the loading bar segment */
        height: 100%;
        background-color: #76c7c0; /* Color of the loading bar segment */
        position: absolute;
        animation: loading 2s linear infinite; /* Animation name, duration, timing function, and repeat */
      }
      /* Keyframes for the loading animation */
      @keyframes loading {
        0% {
          left: -100%; /* Start off-screen to the left */
        }
        50% {
          left: 100%; /* Move off-screen to the right */
        }
        100% {
          left: 100%; /* Ensure it stays off-screen */
        }
      }

      /* Styles for landscape mode prompt */
      #rotateNotice {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        z-index: 1000;
      }
            /* Make the page unscrollable */
            html, body {
        overflow: hidden;
        height: 100%;
        margin: 0; /* Ensure no default margin */
      }
      /* Dev-only badge so it's obvious this is the offline mock */
      #mock-badge {
        position: fixed; top: 6px; right: 8px; z-index: 10000;
        font: 11px/1.4 monospace; color: #fff; background: #b00020;
        padding: 3px 8px; border-radius: 4px; opacity: .85;
        pointer-events: none;
      }
    </style>

    <!--
      OFFLINE MOCK ENTRY POINT.
      This file is identical to index.html except it loads the mock backend
      shim BELOW *before* the viewer module scripts. The shim patches
      window.fetch to serve synthetic fixtures from ./mock/fixtures, so the
      whole viewer runs with zero real network access. index.html stays
      untouched for production. Open via:  npm run dev:mock
    -->
    <script>
      // Bake a synthetic case id so the viewer auto-loads without a real link.
      // token below decodes (src/crypt.js) to case_int_id 12345.
      (function () {
        var p = new URLSearchParams(location.search);
        if (!p.get("id")) {
          p.set("id", "OAJBLhkNOiQsPXc0MW0OASBBDRw");
          location.replace(location.pathname + "?" + p.toString());
        }
      })();
    </script>
    <!-- Classic (non-module) script => runs synchronously before the deferred
         module scripts, guaranteeing fetch is patched before the viewer calls it. -->
    <script src="./mock/fetch-mock.js"></script>
  </head>
  <body>
    <div id="mock-badge">OFFLINE MOCK</div>
    <header>
      <h1>SmartRPD Lite Web</h1>
    </header>
    <main>
      <div id="container3D"></div>
    </main>
    <div id="loading-container"></div>

    <!-- Chat Widget -->
    <div id="chat-widget">
      <div id="chat-box">
        <!-- Messages will appear here -->
      </div>
      <div id="chat-input-area">
        <input type="file" id="imageInput" accept="image/*" hidden />
        <button id="uploadBtn">+</button>
        <input type="text" id="textInput" placeholder="Type a comment..." />
        <button id="sendBtn">Send</button>
      </div>
    </div>
    <div class="image-modal" id="imageModal">
      <img id="modalImage" src="" alt="Zoomed" />
    </div>
    <img id="chat-icon" src="./chat-icon.png" alt="chat" />

    <script type="module" src="./src/chat.js"></script>
    <script type="module" src="./src/mobile.js"></script>
    <script type="module" src="./bundle.js"></script>

  </body>
</html>
